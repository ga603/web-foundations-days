<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes Toolkit</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Notes Toolkit</h1>

        <p>Write your note below. Your draft will be saved automatically.</p>

        <label for="note-text">Your Note</label>

        <textarea
            id="note-text"
            rows="10"
            placeholder="Start typing your note here..."
        ></textarea>

        <p id="char-count">0 / 200 characters</p>

        <p id="word-count">0 words</p>

        <button id="clear-btn" type="button">
            Clear
        </button>

        <button id="theme-toggle" type="button">
            Dark mode
        </button>

    </main>

</body>
</html>
